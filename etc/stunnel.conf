; stunnel config for ristomele
; Listens on HTTPS port 5001, forwards to uwsgi HTTP on localhost:5000.
;
; Install: sudo apt install stunnel4
; Deploy:  sudo cp etc/stunnel.conf /etc/stunnel/ristomele.conf
;          sudo service stunnel4 restart

pid = /var/run/stunnel4/ristomele.pid

[ristomele]
accept  = 0.0.0.0:443
connect = 127.0.0.1:5000
cert    = /home/sta/ristomele/ssl_cert.pem
key     = /home/sta/ristomele/ssl_key.pem
